<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alzheimer's MRI Detection</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6fa; margin: 0; padding: 24px; }
    .card { max-width: 480px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { font-size: 22px; color: #1f3a5f; margin-top: 0; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    select, input[type=file] { width: 100%; }
    button { margin-top: 18px; padding: 10px 18px; background: #1f3a5f; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .result { margin-top: 20px; padding: 14px; background: #e8f4ea; border-radius: 6px; }
    .error { margin-top: 20px; padding: 14px; background: #fdecea; border-radius: 6px; }
    small { color: #666; display: block; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Alzheimer's Disease Detection from MRI</h1>
    <form method="post" enctype="multipart/form-data">
      <label for="algorithm">Algorithm</label>
      <select name="algorithm" id="algorithm">
        {% for key, name in labels.items() %}
        <option value="{{ key }}">{{ name }}</option>
        {% endfor %}
      </select>
      <label for="image">MRI image</label>
      <input type="file" name="image" id="image" accept="image/*" required>
      <button type="submit">Predict</button>
    </form>
    {% if result %}
    <div class="result">
      <b>Predicted class:</b> {{ result.label }}<br>
      <b>Confidence:</b> {{ result.confidence }}%<br>
      <b>Model:</b> {{ result.model }}
    </div>
    {% endif %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <small>Educational project only, not a medical diagnosis tool.</small>
  </div>
</body>
</html>
